name: Agenture cycle

# One turn of the fund: the buyers are topped up, the market runs, and then the judges
# deploy if any of them can still write a cheque. The archive it writes is committed back,
# which is what keeps the deployed frontend's history current.
#
# Deliberately manual. There is no schedule: rounds run when someone asks for one, either
# with `bun run cycle` locally or from the Actions tab here. Nothing fires on its own, so
# capital never moves without a person deciding it should.

on:
  workflow_dispatch:

# Never let two cycles touch the same wallets at once.
concurrency:
  group: agenture-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: agents
        run: bun install --frozen-lockfile

      - name: Run the cycle
        working-directory: agents
        env:
          # How far above its budget each buyer is topped up, so it does not run dry
          # mid-run. Paid by the operator, which is outside the economy.
          CYCLE_CUSTOMER_HEADROOM: '1.4'
          # Circle Gateway serves no testnet on its default (mainnet) host.
          GATEWAY_API_URL: https://gateway-api-testnet.circle.com
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
          ENTITY_SECRET: ${{ secrets.ENTITY_SECRET }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          # Optional. If the primary model provider is down, a failed call becomes a
          # safe pass, so the cycle would quietly record a round where every judge
          # rejects everything. Set these to a different provider to avoid that.
          LLM_FALLBACK_BASE_URL: ${{ secrets.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          LLM_FALLBACK_MODEL: ${{ secrets.LLM_FALLBACK_MODEL }}
        run: bun run cycle

      - name: Commit the archives
        run: |
          # market.json as well as rounds.json: the deliberation and the trading are two
          # halves of the same turn, and the frontend reads both.
          if git diff --quiet -- shared/rounds.json shared/market.json; then
            echo "Nothing new recorded this cycle."
            exit 0
          fi
          git config user.name "agenture-bot"
          git config user.email "agenture-bot@users.noreply.github.com"
          git add shared/rounds.json shared/market.json
          git commit -m "chore: record cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
